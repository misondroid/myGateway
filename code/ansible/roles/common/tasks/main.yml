- name: store ssh key
  shell: |
    install -d -m 700 "$(dirname {{ ssh_key_file | quote }})"
    printf '%s' {{ ssh_key | quote }} | base64 -d > {{ ssh_key_file | quote }}
    chmod 600 {{ ssh_key_file | quote }}
    chown {{ login_user | quote }}:{{ login_user | quote }} {{ ssh_key_file | quote }}

- name: update apt repositories
  apt:
    update_cache: true
- name: upgrade apt packages
  apt:
    upgrade: true

- name: install basic packages
  apt:
    name: "{{ item }}"
    state: present
  loop: "{{ packages.base }}"

- name: set IP fowarding enabled
  sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present

- name: check whether python3-pip is installed
  command: dpkg-query -W -f '${Status}' python3-pip
  register: python3_pip_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: install python packages via pip
  pip:
    name: "{{ item }}"
    state: present
    break_system_packages: true
  loop: "{{ packages.pip }}"
  when: python3_pip_status.stdout == 'install ok installed'

- name: set timezone to JST
  ansible.builtin.timezone:
    name: Asia/Tokyo

- name: set locale to ja_JP.UTF-8
  community.general.locale_gen:
    name: ja_JP.UTF-8
    state: present
 
